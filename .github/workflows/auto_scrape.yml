name: Auto Scrape Berita Unesa

on:
  schedule:
    - cron: '0 1,9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas playwright
          playwright install --with-deps chromium

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit & Push Rekap CSV Terbaru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rekap_berita_unesa.csv
          git commit -m "Auto update rekap berita Unesa via Playwright" || exit 0
          git push
