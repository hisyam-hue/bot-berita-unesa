name: Auto Scrape Berita Unesa

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 07.00 WIB & 17.00 WIB (00:00 UTC & 10:00 UTC)
    - cron: '0 0,10 * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" secara manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rekap_berita_unesa.csv
          git commit -m "Auto update rekap berita Unesa" || exit 0
          git push
